name: Retire the legacy operator download
on:
  push:
    branches: [main]
    paths: ['.github/workflows/retire-operator.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove the archived operator bundle from the public desktop release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          asset="$(gh api "repos/$REPO/releases/tags/v0.6.0" --jq '.assets[] | select(.name == "Clawd-Arena-API-0.6.0.tar.gz") | [.id, .digest] | @tsv')"
          if [ -z "$asset" ]; then exit 0; fi
          id="$(printf '%s' "$asset" | cut -f1)"
          digest="$(printf '%s' "$asset" | cut -f2)"
          test "$digest" = 'sha256:a2728cf012071e7dae84735c3164b534e8a73913d260f47eb604e3ff46ee5dd2'
          gh api --method DELETE "repos/$REPO/releases/assets/$id"
